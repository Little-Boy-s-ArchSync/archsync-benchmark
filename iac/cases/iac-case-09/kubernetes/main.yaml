apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-public
  namespace: orders
  annotations:
    archsync.io/approved: "true"
    archsync.io/trust-boundary: public
spec:
  defaultBackend:
    service:
      name: orders-api
      port:
        number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
  annotations:
    archsync.io/approved: "true"
    archsync.io/trust-boundary: application
spec:
  type: ClusterIP
  ports:
    - port: 80
