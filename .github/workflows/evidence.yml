name: Benchmark evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test ground-truth invariants
        run: node --test
      - name: Validate ground truth
        run: node scripts/validate-ground-truth.mjs
      - name: Prove all patches apply cleanly
        run: node scripts/validate-patches.mjs
      - name: Verify fixture integrity hashes
        run: node scripts/benchmark-integrity.mjs
